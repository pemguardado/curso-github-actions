name: Saludo usando variables
run-name: ¡Estoy aprendiendo a usar Variables :o :o!
on:
  workflow_dispatch
env:
  DIA_DE_SEMANA: Doming
jobs:
  saludo-variables:
    runs-on: ubuntu-latest
    env:
      SALUDO: Hellouss
    steps:
      - name: Saludar
        run: echo "$SALUDO, $NOMBRE. Hoy es $DIA_DE_SEMANA!"
        env:
          NOMBREs: Juan
